[project]
name = "syutyu"
version = "0.1.0"
description = "LAMMPS MD runs and Python analysis: RDF, MSD, VACF, diffusion, plots"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29,<8",
    "jupyterlab>=4.3,<5",
    "nbconvert>=7.16,<8",
]
docs = [
    "furo>=2024.8",
    "myst-parser>=4,<6",
    "sphinx>=8.1,<10",
]

[project.scripts]
syutyu = "syutyu.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
